    <script type="text/javascript">
      // Counterpart to public/404.html's redirect: decode the real path back
      // out of the query string before the router boots, so it sees the
      // clean URL the visitor actually requested.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
