<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sharpline</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a direct hit or refresh on
      // e.g. /inkforge-website/article/foo 404s. This encodes that path into a
      // query string and redirects to the real index.html, which decodes it
      // back (see the matching script in index.html) and hands off to the
      // client-side router — giving clean, crawlable URLs on a static host.
      var pathSegmentsToKeep = 1; // keep "/inkforge-website"
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
